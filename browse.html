    <body data-page="browse">
      <div class="site-frame">
        <header class="site-header" data-site-header></header>
        <main>
          <div class="section-shell">
  <div id="catalog-notice"></div>
  <section class="page-header">
    <span class="page-eyebrow">Browse the catalog</span>
    <h1>Browse all 200+ filters</h1>
    <p class="lead">Search the complete catalog by name, description, tag, model, or category. URL hash state keeps your filters shareable.</p>
  </section>

  <section class="section">
    <div class="browse-layout">
      <aside class="sidebar-panel">
        <div class="filter-group">
          <label class="panel-title" for="browse-search">Search filters</label>
          <input class="search-input" id="browse-search" type="search" placeholder="Search by name, tag, or category" />
        </div>
        <div class="filter-group">
          <label class="panel-title" for="browse-sort">Sort by</label>
          <select class="select-input" id="browse-sort">
            <option value="trending">Trending</option>
            <option value="popular">Popular</option>
            <option value="alpha">A–Z</option>
            <option value="category">Category</option>
            <option value="newest">Newest</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="panel-title" for="filter-ai">AI required</label>
          <select class="select-input" id="filter-ai">
            <option value="all">All filters</option>
            <option value="yes">AI required</option>
            <option value="no">Client-side only</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="panel-title" for="filter-demo">Demo available</label>
          <select class="select-input" id="filter-demo">
            <option value="all">Show all</option>
            <option value="yes">FREE on the web shell</option>
            <option value="no">Requires your own API key</option>
          </select>
        </div>
        <div class="inline-field">
          <label for="filter-seasonal">Current season only</label>
          <input id="filter-seasonal" type="checkbox" />
        </div>
        <div class="filter-group">
          <div class="panel-title">Categories</div>
          <div class="checkbox-list" id="filter-category-options"></div>
        </div>
        <div class="filter-group">
          <div class="panel-title">Filter type</div>
          <div class="checkbox-list" id="filter-type-options"></div>
        </div>
        <div class="filter-group">
          <div class="panel-title">Model</div>
          <div class="checkbox-list" id="filter-model-options"></div>
        </div>
        <button class="button-ghost" id="browse-clear" type="button">Clear filters</button>
      </aside>

      <div>
        <div class="filter-toolbar">
          <div id="results-meta" class="toolbar-caption">Loading starter catalog…</div>
          <a class="button-link" href="/contact.html">Request a filter</a>
        </div>
        <div class="catalog-grid" id="browse-grid"></div>
      </div>
    </div>
  </section>
</div>

        </main>
        <footer class="site-footer" data-site-footer></footer>
