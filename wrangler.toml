name = "gicphotofilters"
compatibility_date = "2026-03-12"
pages_build_output_dir = "."
send_metrics = false

[ai]
binding = "AI"

# R2 bucket — enable R2 in the Cloudflare Dashboard and uncomment when ready for live AI transforms
# [[r2_buckets]]
# binding = "PHOTO_BUCKET"
# bucket_name = "gic-photo-filters-temp"
# preview_bucket_name = "gic-photo-filters-temp-preview"

[[kv_namespaces]]
binding = "USAGE_KV"
id = "69d43c998f9440ed9c73648d9591beee"
preview_id = "1a04e87cc92048c48e2ca544e9b2be02"

[vars]
STORAGE_MODE = "direct"
# Neuron budget math (2026-07-17, revised): flux-2-klein-9b is hardcoded at
# 1410 neurons/run in functions/_lib/ai.js (and baked into estimatedNeurons for
# all 174 flux2-klein-9b filters in docs/filters-index.json) — derived from
# Cloudflare's published per-model pricing (1363.64 neurons for the first
# output MP, our 768x768 output falls in that flat tier, + 181.82 neurons/MP of
# input image, our 512x512 input cap ≈ 0.25MP ≈ 45 neurons). This replaces an
# earlier placeholder of 150 that was never measured and undercounted real
# cost by ~10x. It is STILL an estimate, not confirmed against a real
# Cloudflare billing/dashboard run. At 1410 neurons/run:
#   10000 / 1410 ≈ 7 real transforms sitewide/day before this breaker trips
#   7 / MAX_FREE_TRANSFORMS_PER_IP(5) ≈ 1 unique IP/day fully using their cap
# That is not a usable production budget for a public site — it was left at
# 10000 deliberately pending a real Cloudflare dashboard number; raising it is
# the project owner's call, not something to bump automatically here.
MAX_FREE_NEURONS_PER_DAY = "10000"
MAX_FREE_TRANSFORMS_PER_IP = "5"
SEASONAL_FILTER = ""
SEASONAL_FILTER_BONUS_TRANSFORMS = "0"
MAX_UPLOAD_BYTES = "5242880"
MAX_IMAGE_DIMENSION = "512"
RESULT_TTL_SECONDS = "86400"
JOB_STATUS_TTL_SECONDS = "86400"
TRANSFORM_TIMEOUT_MS = "45000"
